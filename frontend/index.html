
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PantryPal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>PantryPal</h1>
      <p>Your pantry, organized.</p>
    </header>

    <section class="card">
      <h2>Find a product</h2>

      <form id="lookup-form" novalidate>
        <label for="barcode">Product barcode</label>
        <input
          id="barcode"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Enter 8 to 14 digits"
        >

        <button id="lookup-button" type="submit">Look up product</button>
      </form>

      <p id="lookup-message" class="message" role="status"></p>

      <div id="lookup-result" class="product" hidden>
        <img id="product-image" alt="" hidden>
        <dl>
          <dt>Name</dt><dd id="product-name"></dd>
          <dt>Brand</dt><dd id="product-brand"></dd>
          <dt>Nutri-Score</dt><dd id="product-nutriscore"></dd>
        </dl>
      </div>

      <form id="add-form" class="add-form" novalidate hidden>
        <label for="add-quantity">Quantity</label>
        <input
          id="add-quantity"
          type="number"
          inputmode="numeric"
          min="1"
          max="999"
          step="1"
          value="1"
        >
        <button id="add-button" type="submit">Add to pantry</button>
      </form>

      <p id="add-message" class="message" role="status"></p>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>My pantry</h2>
        <button id="refresh-pantry" type="button" class="secondary">Refresh</button>
      </div>

      <p id="pantry-message" class="message" role="status"></p>
      <p id="pantry-empty" class="hint" hidden>Your pantry is empty. Look up a product above to add it.</p>
      <ul id="pantry-list" class="pantry-list"></ul>
    </section>

    <section class="card">
      <h2>Service status</h2>

      <p>
        Pantry Service:
        <span id="pantry-status">Checking...</span>
      </p>

      <p>
        Catalog Service:
        <span id="catalog-status">Checking...</span>
      </p>

      <button id="refresh-status">
        Refresh status
      </button>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="lookup.js"></script>
  <script src="pantry.js"></script>
  <script src="app.js"></script>
</body>
</html>
