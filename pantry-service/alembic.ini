[alembic]
script_location = migrations
# Lets migrations/env.py import the app package.
prepend_sys_path = .
path_separator = os

# No sqlalchemy.url here: env.py builds it from the DB_* environment variables,
# so no password is ever written in this file.

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

# INFO shows "Running upgrade ... -> 0001" in the container logs.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
format = %(levelname)s [alembic] %(message)s
