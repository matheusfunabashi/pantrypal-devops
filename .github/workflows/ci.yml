# CI for PantryPal. Runs on every pull request and on pushes to main.
#
#   test     lint (ruff), format check, tests with a coverage gate (pytest-cov)
#            and a dependency audit (pip-audit), for each service
#   image    build each service image and check it runs as non-root
#   compose  bring up the full stack with docker compose and check every /health
#
# The workflow_call trigger lets the CD workflow reuse this one as its first
# stage. Deployment itself is not part of this file.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [pantry-service, catalog-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: ruff check .

      - name: Format check
        working-directory: ${{ matrix.service }}
        run: ruff format --check .

      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      # TEMPORARY ignores. fastapi 0.115.6 pins starlette 0.41.3, which has the
      # starlette findings below (fixed in starlette 1.3.1); anyio is pulled in
      # transitively. Remove these once the FastAPI stack is bumped.
      - name: Audit dependencies
        working-directory: ${{ matrix.service }}
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-4024 \
            --ignore-vuln PYSEC-2026-4025

  image:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [pantry-service, catalog-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pantrypal-${{ matrix.service }}:ci ./${{ matrix.service }}

      # The services run database migrations on startup, so /health cannot be
      # checked on a lone container. The compose job below checks it with the
      # databases up.
      - name: Check the image runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id pantrypal-${{ matrix.service }}:ci -u)
          echo "container uid: $uid"
          test "$uid" != "0"

  compose:
    name: compose stack
    needs: [test, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with throwaway CI passwords
        # These values exist only for this job. They are not secrets and are
        # never written to the repository.
        run: |
          gen() { echo "Aa1!$(openssl rand -hex 16)"; }
          {
            echo "PANTRY_DB_PASSWORD=$(gen)"
            echo "CATALOG_DB_PASSWORD=$(gen)"
            echo "PANTRY_DB_APP_PASSWORD=$(gen)"
            echo "CATALOG_DB_APP_PASSWORD=$(gen)"
            echo "LOG_LEVEL=INFO"
            echo "OFF_BASE_URL=https://world.openfoodfacts.org"
            echo "OFF_TIMEOUT_SECONDS=5"
          } > .env

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for both APIs and the frontend
        run: |
          check() {
            for i in $(seq 1 90); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$1" || true)
              if [ "$code" = "200" ]; then
                echo "$1 -> 200"
                return 0
              fi
              sleep 2
            done
            echo "$1 never returned 200 (last code: $code)"
            return 1
          }
          check http://localhost:8000/health
          check http://localhost:8001/health
          check http://localhost:8080/

      - name: Init jobs must exit 0
        run: |
          for svc in pantry-db-init catalog-db-init; do
            id=$(docker compose ps -aq "$svc")
            code=$(docker inspect -f '{{.State.ExitCode}}' "$id")
            echo "$svc exit code: $code"
            test "$code" = "0"
          done

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
