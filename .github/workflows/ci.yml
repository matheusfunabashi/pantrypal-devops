# CI for PantryPal. Runs on every pull request and on pushes to main.
#
#   test     unit tests for each service (pytest)
#   image    build each service image and check that its /health answers
#   compose  bring up the full stack with docker compose and check every /health
#
# Deployment (GHCR push, Azure) is Sprint 1 and is not part of this workflow.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [pantry-service, catalog-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: python -m pytest -q

  image:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: pantry-service
            port: 8000
          - service: catalog-service
            port: 8001
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pantrypal-${{ matrix.service }}:ci ./${{ matrix.service }}

      - name: Start container and check /health
        run: |
          docker run -d --name svc -p ${{ matrix.port }}:8000 pantrypal-${{ matrix.service }}:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${{ matrix.port }}/health" || true)
            if [ "$code" = "200" ]; then
              echo "/health returned 200"
              exit 0
            fi
            sleep 1
          done
          echo "/health never returned 200 (last code: $code)"
          docker logs svc
          exit 1

      - name: Check the container runs as non-root
        run: |
          uid=$(docker exec svc id -u)
          echo "container uid: $uid"
          test "$uid" != "0"

      - name: Container logs
        if: always()
        run: docker logs svc || true

  compose:
    name: compose stack
    needs: [test, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with throwaway CI passwords
        # These values exist only for this job. They are not secrets and are
        # never written to the repository.
        run: |
          gen() { echo "Aa1!$(openssl rand -hex 16)"; }
          {
            echo "PANTRY_DB_PASSWORD=$(gen)"
            echo "CATALOG_DB_PASSWORD=$(gen)"
            echo "PANTRY_DB_APP_PASSWORD=$(gen)"
            echo "CATALOG_DB_APP_PASSWORD=$(gen)"
            echo "LOG_LEVEL=INFO"
            echo "OFF_BASE_URL=https://world.openfoodfacts.org"
            echo "OFF_TIMEOUT_SECONDS=5"
          } > .env

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for both APIs and the frontend
        run: |
          check() {
            for i in $(seq 1 90); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$1" || true)
              if [ "$code" = "200" ]; then
                echo "$1 -> 200"
                return 0
              fi
              sleep 2
            done
            echo "$1 never returned 200 (last code: $code)"
            return 1
          }
          check http://localhost:8000/health
          check http://localhost:8001/health
          check http://localhost:8080/

      - name: Init jobs must exit 0
        run: |
          for svc in pantry-db-init catalog-db-init; do
            id=$(docker compose ps -aq "$svc")
            code=$(docker inspect -f '{{.State.ExitCode}}' "$id")
            echo "$svc exit code: $code"
            test "$code" = "0"
          done

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
