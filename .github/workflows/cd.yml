# CD for PantryPal. Runs on every push to main (a merged pull request) and by hand.
#
#   ci      the whole CI workflow (ci.yml), reused through workflow_call.
#           Nothing below runs unless every CI job passed on this commit.
#   images  build both service images and push them to GitHub Container Registry,
#           tagged with the commit SHA (and latest)
#
# Stage 2 (S1-04) adds the Azure jobs after images: deploy both Container Apps,
# deploy the UI to Static Web Apps, then check /health on both services.

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time. A newer run waits instead of cancelling one
# that is halfway through a deploy.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  images:
    name: image (${{ matrix.service }})
    needs: ci
    # workflow_dispatch can be started from any branch. Only publish from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [pantry, catalog]
    permissions:
      contents: read
      # Lets GITHUB_TOKEN push to GitHub Container Registry.
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lower case; the repository owner may not be.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pantrypal-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}-service
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          # Links the package to this repository on GitHub, and records the commit.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
